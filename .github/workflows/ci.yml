name: ci

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  tests:
    name: tests (${{ matrix.os }} / py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Tests (unittest)
        run: python -m unittest discover tests -v

      - name: Verificar lab_setup (genera + limpia)
        run: |
          python core/lab_setup.py
          python core/lab_setup.py --clean

  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar ruff + flet (el auditor lo necesita)
        run: pip install ruff -r requirements.txt

      - name: "Ruff check (gate fase 1: sintaxis + nombres no definidos)"
        run: ruff check app core modulos/common gui_flet scripts tests flet_main.py

      - name: Auditoría API Flet
        run: python scripts/auditar_flet.py

  docs:
    name: docs (sync + astro build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validar sincronía config ↔ README
        run: python scripts/generar_indice.py --check

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Instalar web/
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Build Astro (regenera docs vía prebuild)
        working-directory: web
        run: pnpm build
