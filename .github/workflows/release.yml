name: release

# Se dispara al pushear un tag v* (ej: v1.0.0.0-alpha).
# Empaqueta la GUI Flet con `flet pack` en los 3 OS y publica los binarios
# en GitHub Releases. Tags con -alpha/-beta se marcan pre-release.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artefacto: easml-linux.tar.gz
          - os: windows-latest
            artefacto: EASML-windows.zip
          - os: macos-latest
            artefacto: easml-macos.zip
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias (flet + flet pack + PyInstaller)
        # flet pack NO trae PyInstaller: lo exige instalado aparte.
        run: pip install -r requirements.txt pyinstaller

      - name: Empaquetar con flet pack
        # Metadatos gratis anti-SmartScreen: sin firma Authenticode ($0),
        # pero con empresa/versión/descripción el aviso baja un nivel.
        # --file-version exige formato n.n.n.n (1.0.0.0 calza).
        run: |
          VER="${GITHUB_REF_NAME#v}"
          VER="${VER%%-*}"
          flet pack flet_main.py -n EASML \
            --product-name EASML \
            --product-version "$VER" \
            --file-version "$VER" \
            --company-name EASML \
            --file-description "EASML: laboratorio-juego educativo de ciberseguridad (simulaciones contenidas)" \
            --copyright "EASML contributors" \
            --add-data "assets:assets" \
            --add-data "modulos:modulos" \
            --add-data "core:core" \
            --distpath dist
        shell: bash

      - name: Arena pre-creada + zip (Windows)
        if: runner.os == 'Windows'
        run: |
          copy LEEME-alpha.txt dist/
          $env:EASML_HOME = "$pwd/dist"
          python core/lab_setup.py
          python core/lab_setup.py --status
          Compress-Archive -Path dist/* -DestinationPath "${{ matrix.artefacto }}"
          (Get-FileHash "${{ matrix.artefacto }}" -Algorithm SHA256).Hash `
            | Out-File "${{ matrix.artefacto }}.sha256" -NoNewline
        shell: pwsh

      - name: Empaquetar artefacto (Linux)
        if: runner.os == 'Linux'
        run: |
          cp LEEME-alpha.txt dist/ 2>/dev/null || true
          tar -czf "${{ matrix.artefacto }}" -C dist .
          sha256sum "${{ matrix.artefacto }}" > "${{ matrix.artefacto }}.sha256"
        shell: bash

      - name: Empaquetar artefacto (macOS)
        if: runner.os == 'macOS'
        run: |
          cp LEEME-alpha.txt dist/ 2>/dev/null || true
          ditto -c -k dist "${{ matrix.artefacto }}"
          shasum -a 256 "${{ matrix.artefacto }}" > "${{ matrix.artefacto }}.sha256"
        shell: bash

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: easml-${{ runner.os }}
          path: |
            easml-linux.tar.gz
            easml-linux.tar.gz.sha256
            EASML-windows.zip
            EASML-windows.zip.sha256
            easml-macos.zip
            easml-macos.zip.sha256
          if-no-files-found: error

  publish:
    name: publicar release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: binarios
          merge-multiple: true

      - name: Publicar en GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: binarios/**
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
